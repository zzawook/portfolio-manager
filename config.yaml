# 포트폴리오 목표 비중 설정 (2026-10-16 확정안)
# 코어 65% (예측 없이 유지) + 위성 35% (매크로 판단)

base_currency: USD

broker:
  type: mock                       # mock: 예시 파일로 드라이런 / ibkr: 실제 계좌
  mock_file: examples/month01.yaml
  ibkr:
    base_url: https://localhost:5000/v1/api   # Client Portal Gateway 기본 주소
    account_id: ""                 # 비워 두고 환경 변수 IBKR_ACCOUNT_ID를 쓰면 git에 안 올라가요
    verify_ssl: false              # Gateway는 자체 서명 인증서를 써요

rules:
  monthly_contribution: 3000       # 월 적립액 (입금 확인 경고에만 써요)
  max_buy_orders: 3                # 정기 적립 때 한 번에 사는 종목 수 (최소 수수료 절약)
  min_order_value: 100             # 이보다 작은 주문은 안 보내요
  max_order_value: 5000            # 1회 주문 한도 (실수 방지)
  cash_reserve: 20                 # 수수료용으로 남겨 두는 현금
  drift_threshold_pp: 5.0          # 목표보다 이만큼(%p) 많아지면 매도 포함 리밸런싱
  annual_rebalance_month: 1        # 매년 이 달엔 리밸런싱
  min_value_for_rebalance: 20000   # 투자 금액이 이보다 작으면 팔지 않고 적립으로만 맞춰요
  limit_buffer_pct: 0.3            # 지정가 = 매도호가 × (1 + 0.3%), 매도는 반대
  max_satellite_idea_pct: 15       # 위성 아이디어 하나의 최대 비중

# conid는 IBKR 종목 번호예요. `python -m rebalancer resolve`로 찾아서 채우세요.
instruments:
  VWRA: {name: Vanguard FTSE All-World UCITS ETF (USD) Acc, exchange: LSE, currency: USD, conid: null}
  AGGU: {name: iShares Core Global Aggregate Bond UCITS ETF USD Hedged (Acc), exchange: LSE, currency: USD, conid: null}
  IGLN: {name: iShares Physical Gold ETC (USD), exchange: LSE, currency: USD, conid: null}
  SMH:  {name: VanEck Semiconductor UCITS ETF (USD), exchange: LSE, currency: USD, conid: null}
  ZAPP: {name: Global X U.S. Electrification UCITS ETF (USD Acc), exchange: LSE, currency: USD, conid: null}
  WDGF: {name: WisdomTree Global Defence UCITS ETF (USD Acc), exchange: LSE, currency: USD, conid: null}

allocations:
  core:
    - {symbol: VWRA, target: 40, label: 전세계 주식}
    - {symbol: AGGU, target: 15, label: 글로벌 채권 (달러 헤지)}
    - {symbol: IGLN, target: 10, label: 금}

  # 위성은 thesis(이유)와 invalidation(틀렸다고 볼 조건)이 없으면 실행되지 않아요.
  # 아래 문구는 예시예요. 본인 판단으로 고쳐 쓰세요.
  satellite:
    - symbol: SMH
      target: 15
      label: AI 반도체
      thesis: AI 설비투자가 이어지면서 반도체 수요가 늘어난다
      invalidation: 빅테크 AI 설비투자 가이던스가 두 분기 연속 줄어든다
    - symbol: ZAPP
      target: 5
      label: 전력 인프라
      thesis: AI 데이터센터 확대로 미국 전력망 투자가 늘어난다
      invalidation: 데이터센터 투자 축소로 미국 전력 수요 전망이 낮아진다
    - symbol: WDGF
      target: 10
      label: 글로벌 방산
      thesis: 유럽 안보 위기로 각국 방산 지출이 늘어난다
      invalidation: 휴전 또는 유럽 국방비 증액 계획 축소
    - symbol: IGLN
      target: 5
      label: 금 (위성)
      thesis: 전쟁 등 위기에 대비한 장기 보유
      invalidation: 위기 신호 없이 실질금리가 계속 오른다
