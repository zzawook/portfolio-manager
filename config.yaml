# 리밸런서 설정 (2026-10-16 확정안)
# 목표 비중과 종목은 portfolio.yaml에 있어요. 웹 화면에서 고치면 그 파일이 바뀌어요.

base_currency: USD
portfolio_file: portfolio.yaml

broker:
  type: mock                       # mock: 예시 파일로 드라이런 / ibkr: 실제 계좌
  mock_file: examples/month01.yaml
  ibkr:
    base_url: https://localhost:5000/v1/api   # Client Portal Gateway 기본 주소
    account_id: ""                 # 비워 두고 환경 변수 IBKR_ACCOUNT_ID를 쓰면 git에 안 올라가요
    verify_ssl: false              # Gateway는 자체 서명 인증서를 써요

rules:
  monthly_contribution: 3000       # 월 적립액 (입금 확인 경고에만 써요)
  max_buy_orders: 3                # 정기 적립 때 한 번에 사는 종목 수 (최소 수수료 절약)
  min_order_value: 100             # 이보다 작은 주문은 안 보내요
  max_order_value: 5000            # 1회 주문 한도 (실수 방지)
  cash_reserve: 20                 # 수수료용으로 남겨 두는 현금
  drift_threshold_pp: 5.0          # 목표보다 이만큼(%p) 많아지면 매도 포함 리밸런싱
  annual_rebalance_month: 1        # 매년 이 달엔 리밸런싱
  min_value_for_rebalance: 20000   # 투자 금액이 이보다 작으면 팔지 않고 적립으로만 맞춰요
  limit_buffer_pct: 0.3            # 지정가 = 매도호가 × (1 + 0.3%), 매도는 반대
  max_satellite_idea_pct: 15       # 위성 아이디어 하나의 최대 비중

# 예상 수수료 (주문 계획에 표시하고, 매수 수량을 정할 때 현금에서 미리 빼요)
# 기본값은 IBKR Pro Fixed, 런던거래소(LSE) 달러 거래 기준이에요 (2026-10 IBKR 싱가포르 공식 표).
# Tiered를 쓰면 아래 세 줄을 바꾸세요: min_per_order 1.70, max_per_order 39, extra_per_order 0.21
# (Tiered는 주문 금액 약 7,000불까지 Fixed보다 싸요. IBKR 설정에서 요금제를 바꿀 수 있어요.)
fees:
  rate_pct: 0.05                   # 거래 금액의 0.05%
  min_per_order: 4.00              # 주문당 최소
  max_per_order: 0                 # 주문당 최대 (0이면 상한 없음)
  extra_per_order: 0               # 거래소와 청산 수수료 (Tiered일 때만)
  gst_pct: 9                       # 싱가포르 거주자는 수수료에 GST 9%가 붙어요
  warn_pct: 1.0                    # 수수료가 주문 금액의 이 비율(%) 이상이면 경고
  fx_rate_bp: 0.2                  # SGD를 USD로 바꿀 때 IBKR 환전 수수료 (0.2bp, 최소 2불)
  fx_min: 2.0

# 웹 화면의 채팅 설정. 키는 이 파일에 적지 말고 환경 변수나 .env 파일에 넣으세요 (.env는 git에 안 올라가요).
#   chatgpt            ChatGPT Plus나 Pro 구독으로 써요 (Sign in with ChatGPT). 키 필요 없음. 채팅 창에서 로그인해요.
#                      로그인 정보는 chatgpt-auth.json에 저장돼요 (git에 안 올라가요). 기본 모델 gpt-6.1-sol
#   anthropic          Claude. 키: ANTHROPIC_API_KEY. 기본 모델 claude-sonnet-5-5
#   openai             OpenAI API (Responses API). 키: OPENAI_API_KEY. 기본 모델 gpt-6.1-sol
#   openai-compatible  OpenAI 호환 서버. base_url과 model을 꼭 적어요. 키 변수 이름은 api_key_env에.
#                      Gemini   base_url: https://generativelanguage.googleapis.com/v1beta/openai  api_key_env: GEMINI_API_KEY
#                      OpenRouter base_url: https://openrouter.ai/api/v1  api_key_env: OPENROUTER_API_KEY
#                      Ollama(내 컴퓨터) base_url: http://localhost:11434/v1  (키 없음)
assistant:
  provider: chatgpt
  model: ""                        # 비워 두면 위의 기본 모델
  api_key_env: ""                  # 비워 두면 위의 기본 변수 이름
  base_url: ""
  max_tokens: 4096                 # chatgpt에서는 보내지 않아요 (플랜 경로가 이 값을 받지 않아요)
  reasoning_effort: ""             # openai, chatgpt만: none, low, medium, high
